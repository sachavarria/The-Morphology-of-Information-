const $=x=>document.getElementById(x),ctx=$('c').getContext('2d'),W=720,H=440,A='#624594',M='#77756e',R='#ac4e36';let t=0,playing=false,last=0,idx=-1;const clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,p)=>a+(b-a)*p;

function render(v){t=Math.max(0,Math.min(220,v));let i=scenes.findLastIndex(s=>s[0]<=t);if(i<0)i=0;let s=scenes[i],p=clamp((t-s[0])/((scenes[i+1]?.[0]||220)-s[0]));if(i!==idx){idx=i;$('section').textContent=String(i+1).padStart(2,'0')+' / '+s[1];$('q').textContent=s[2];$('ex').textContent=s[3];$('metrics').innerHTML=s[4].map((m,j)=>j%2?'':'<div><b>'+m+'</b><small>'+s[4][j+1]+'</small></div>').join('');$('limit').textContent=s[5];$('thought').textContent='NEXT QUESTION / '+s[6];$('caption').textContent='SCHEMATIC ANIMATION / ARCHIVED VALUES IN TEXT';$('chapter').value=i}

if(i<2){let u=i===0?0:clamp(p*1.6),ps=Array.from({length:35},(_,j)=>{let a=j*2.39996+p*1.8,r=150*Math.sqrt((j+.5)/35);return[mix(360+Math.sin(j*2.3)*45,360+Math.cos(a)*r,u),mix(36+j*10.5,205+Math.sin(a)*r,u)]});graph(ps,edges.filter(e=>e[1]<35).slice(0,Math.floor(37*(i===0?clamp(p*2):1))),4);txt(i===0?'DEPENDENCY / AXIAL':'FIXED RELATIONS / VARIABLE GEOMETRY',360,416)}
else if(i===2){for(let k=0;k<Math.ceil(p*24);k++){let cx=65+k%6*118,cy=53+Math.floor(k/6)*95,ps=Array.from({length:12},(_,j)=>[cx+Math.sin(j*2.4+k)*43,cy+Math.cos(j*1.7+k)*31]);graph(ps,Array.from({length:11},(_,j)=>[j,j+1]),2)}txt('CONNECTED CONTROL ENSEMBLES',360,424)}
else if(i===3){let ps=Array.from({length:20},(_,j)=>[360+Math.cos(j*2.4)*Math.sqrt((j+.5)/20)*290,210+Math.sin(j*2.4)*Math.sqrt((j+.5)/20)*160]);let es=Array.from({length:19},(_,j)=>[Math.floor(j/2),j+1]);for(let a=0;a<20;a++)for(let b=a+1;b<20;b++)if((a*79+b*137)%100<70*(1-p))es.push([a,b]);graph(ps,es,5);txt('ALTERNATIVE PATHS WITHDRAWN',360,420)}
else if(i===4){let n=30+Math.floor(p*298),ps=Array.from({length:n},(_,j)=>[360+Math.cos(j*2.4)*Math.sqrt((j+.5)/n)*300,205+Math.sin(j*2.4)*Math.sqrt((j+.5)/n)*170]);graph(ps,Array.from({length:n-1},(_,j)=>[Math.floor(j*.8),j+1]),2);txt('REVISE SAMPLING PROCEDURE',360,420)}
else if(i===5||i===7){let ps=[[180,95],[360,310],[540,95]];line(ps[0],ps[1],A,3);line(ps[1],ps[2],A,3);if(i===5||p<.5)line(ps[0],ps[2],R,3);ps.forEach((a,j)=>{dot(a,17);txt(['A','B','C'][j],a[0],a[1]+37,22)});txt(i===5?'A → B → C / A → C':'INDIRECT REACHABILITY PERSISTS',360,410)}
else if(i===6){let x=v=>70+(v-1000)/3100*580;line([x(3404),65],[x(3404),345],R,3);txt('OBSERVED 3,404',x(3404),46,16,R);[[3658,135,'DEGREE ONLY'],[1516,275,'DEGREE + RECIPROCITY']].forEach(([v,y,l])=>{line([70,y],[650,y],'#c3bfb7');dot([x(v),y],10,A);txt(l,70,y-24,16,M,'left');txt(String(v),x(v),y+31,19,A)});dot([x(mix(3658,1516,clamp(p*1.6))),mix(135,275,clamp(p*1.6))],5,R);txt(p<.5?'0.93 × OBSERVED / MEDIAN':'2.25 × OBSERVED / MEDIAN',360,408,20,A)}
