<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The thermodynamic history of a fact</title><style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap');*{box-sizing:border-box}body{margin:0;background:#080b10;color:#e7e9e5;font-family:'Space Grotesk',monospace}main{max-width:1100px;margin:auto;padding:14px}header{font-size:11px;letter-spacing:.16em;display:flex;justify-content:space-between}canvas{width:100%;height:auto;display:block;margin:14px 0;border:1px solid #343d48}#words{font-size:clamp(21px,4vw,38px);line-height:1.18;min-height:3.8em;max-width:850px}button{background:transparent;color:inherit;border:1px solid #697785;padding:10px;font:inherit}input{width:100%;accent-color:#d6e6df}small{color:#aebac5}</style><main><header><span>MORPHOLOGY OF INFORMATION</span><span>STUDY 06</span></header><canvas id="c" width="960" height="680"></canvas><div id="words">Something happens in a region of space.</div><input id="s" type="range" min="0" max="360" step=".1" value="0"><button id="b">Play</button> <button id="r">Restart</button> <small id="clock">00:00 / 06:00</small><p><small>THE THERMODYNAMIC HISTORY OF A FACT / idealized recording model. Work is a lower bound under specified recording assumptions, not a universal cost of truth.</small></p></main><script>
const c=document.getElementById('c'),g=c.getContext('2d'),s=document.getElementById('s'),b=document.getElementById('b'),words=document.getElementById('words'),clock=document.getElementById('clock');let t=0,playing=false,last=performance.now();const chapters=['THE OCCURRENCE','THE PRODUCTION OF WITNESSES','THE MASS OF CERTAINTY','THE MAINTENANCE OF THE PAST','THE INACCESSIBLE','THE THERMODYNAMIC HISTORY OF A FACT'];const lines=[['Something happens in a region of space.','The occurrence has a finite duration.','A surrounding system changes in response.','The event ends. A physical trace remains.','A trace is a difference in the state of another system.','The history of the occurrence has only begun.'],['One system carries a record.','A second system acquires a record of the same event.','Independent observers can now obtain the same information.','The records occupy distinct physical degrees of freedom.','Under the recording model, producing reliable copies requires work.','Objectivity acquires a distributed physical architecture.'],['Consider two occurrences with identical information content.','One is recorded once. The other is recorded a million times.','Their information content is identical. Their redundancy differs.','For ideal one-bit records, the model bounds work by R kBT ln 2.','At 300 kelvin, one such energy unit is approximately 2.87 × 10⁻²¹ joules.','The cost scales with the number of independent records.'],['The occurrence is over. Its records remain in time.','Thermal fluctuations can degrade a physical record.','A record may survive without active maintenance if sufficiently stable.','Other records require repair, refreshment or replacement.','The cost of maintenance depends on the physical memory and its environment.','A moment can acquire a material history lasting centuries.'],['An intelligence enters the system.','It has access to only a subset of the records.','Give it an arbitrarily large energy budget.','Energy cannot substitute for an interaction that is forbidden.','Records beyond its reach may remain independently readable.','The accessibility of a fact has a geometry of its own.'],['How long did the event last?','How many systems retain a trace of it?','What physical resources made it collectively accessible?','Which traces can an intelligence reach?','The occurrence, its records and their accessibility have distinct histories.','The event has ended. Its thermodynamic history has not.']];
function draw(){let k=Math.min(5,Math.floor(t/60)),u=t-k*60,q=Math.min(5,Math.floor(u/10));words.textContent=lines[k][q];g.fillStyle='#080b10';g.fillRect(0,0,960,680);let R=k===0?+(u>24):k===1?Math.max(1,Math.floor(Math.exp(u/60*6.93))):k===2?Math.floor(Math.exp(u/60*13.8155)):1000000;let A=k===4?Math.floor(R*Math.max(.001,1-u/60)):k===5?1000:R;let n=k===0?1:Math.min(650,Math.ceil(Math.log2(R+1)*32));let angle=t*.14;g.save();g.translate(480,330);for(let i=0;i<24;i++){let z=(i/24+t*.13)%1,scale=.15+z*1.5;g.strokeStyle='rgba(91,126,146,'+(.06+z*.12)+')';g.strokeRect(-290*scale,-170*scale,580*scale,340*scale)}for(let i=0;i<n;i++){let a=i*2.399963+angle,rad=35+Math.sqrt(i/n)*270,zz=Math.sin(i*1.731+t*.6),x=Math.cos(a)*rad,y=Math.sin(a)*rad*.65+zz*45;let visible=k<4||i/n<A/R;g.strokeStyle=visible?'rgba(180,229,219,.35)':'rgba(95,111,130,.13)';g.fillStyle=visible?'rgba(217,246,229,.7)':'rgba(95,111,130,.18)';let w=8+20*(zz+1);g.save();g.translate(x,y);g.rotate(a*.4);g.strokeRect(-w/2,-w/3,w,w*.66);if(i%5===0){g.fillRect(-2,-2,4,4);g.beginPath();g.moveTo(0,0);g.lineTo(35,zz*50);g.stroke()}g.restore()}g.strokeStyle='#f1eee0';g.lineWidth=1.5;for(let j=0;j<3;j++){g.beginPath();for(let i=0;i<=120;i++){let a=i/120*Math.PI*2,rr=22+9*Math.sin(a*5+t*3+j);let x=rr*Math.cos(a),y=rr*Math.sin(a);i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}g.restore();g.font='17px Space Grotesk, monospace';g.fillStyle='#a9c3c7';g.fillText('0'+(k+1)+' / '+chapters[k],24,34);g.font='13px Space Grotesk, monospace';g.fillText('RECORDS',24,590);g.fillText('WORK LOWER BOUND / kBT ln 2',320,590);g.fillText('ACCESSIBLE',760,590);g.font='28px Space Grotesk, monospace';g.fillStyle='#e7eee7';g.fillText(R.toLocaleString(),24,625);g.fillText(R.toLocaleString(),320,625);g.fillText(A.toLocaleString(),760,625);g.fillStyle='#759b9e';g.fillRect(24,650,912*t/360,2);s.value=t;clock.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 06:00'}function tick(now){if(playing){t=Math.min(360,t+(now-last)/1000);if(t===360){playing=false;b.textContent='Play'}}last=now;draw();requestAnimationFrame(tick)}b.onclick=()=>{if(t===360)t=0;playing=!playing;last=performance.now();b.textContent=playing?'Pause':'Play'};document.getElementById('r').onclick=()=>{t=0;last=performance.now();playing=true;b.textContent='Pause'};s.oninput=()=>{t=+s.value;draw()};draw();requestAnimationFrame(tick);
</script></html>
